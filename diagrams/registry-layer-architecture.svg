<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">Registry-layer deception: reference architecture</title>
      <desc id="arch-desc">
        An AI agent connects to one MCP server portal that lists two real servers and two decoy
        servers together. The KubeTrap decoy exposes three tiers of tools. Past the detection boundary,
        every tool hands out an artifact with a canary in it: an internal hostname and a webhook URL in
        Tier 2, a kubeconfig in Tier 3. Retrieving an artifact fires Stage 1; using it (a DNS lookup, a
        webhook call, kubectl) fires Stage 2. Both canaries, the decoy's worker logs and the portal's own logs go to a SIEM and
        are correlated on session ID.
      </desc>
